name: image

# Re-publishes the plugin host image of an already released version (amd64 + arm64) from its tag,
# without touching NuGet or the GitHub Release — e.g. to add a platform to an existing tag.
#   gh workflow run image.yml -f version=0.9.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version (tag v<version> must exist)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # This branch's Dockerfile (cross-publishing), the tag's sources as the build context.
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: tag
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the plugin host image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f current/Dockerfile -t ghcr.io/nightbaker/fleans-plugins:$VERSION --push tag
