name: release

# Push a tag v<version> (matching VersionPrefix/VersionSuffix in Directory.Build.props) to publish
# every plugin's NuGet package to nuget.org and every host image to ghcr.io, then create the
# GitHub Release. All plugins in this repo share one version.
#
# NuGet uses Trusted Publishing — no stored API key. The job's GitHub OIDC token is exchanged for a
# 1-hour nuget.org key, which requires a Trusted Publishing policy on nuget.org (owner nightBaker):
#   Repository Owner: nightBaker · Repository: fleans-plugins · Workflow File: release.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub Release
  packages: write   # ghcr.io image
  id-token: write   # OIDC token for NuGet Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet test -c Release
      - run: |
          for p in Fleans.Plugins.CamundaExternalTask Fleans.Plugins.RestCaller; do
            dotnet pack src/$p -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts
          done
      # Requested right before the push: the temporary key is valid for one hour.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: nightBaker   # nuget.org profile name that owns the policy (not an email)
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push host images
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          push() {
            image=ghcr.io/nightbaker/$1
            docker build --build-arg HOST=$2 -t $image:$VERSION -t $image:latest .
            docker push $image:$VERSION
            docker push $image:latest
          }
          push fleans-camunda-external-task Fleans.CamundaExternalTask.Host
          push fleans-rest-caller Fleans.RestCaller.Host
      # Last, so a release only appears once the package and the image are published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          {
            echo "- NuGet: [\`Fleans.Plugins.CamundaExternalTask\` $VERSION](https://www.nuget.org/packages/Fleans.Plugins.CamundaExternalTask/$VERSION)"
            echo "- Image: \`ghcr.io/nightbaker/fleans-camunda-external-task:$VERSION\`"
            echo "- NuGet: [\`Fleans.Plugins.RestCaller\` $VERSION](https://www.nuget.org/packages/Fleans.Plugins.RestCaller/$VERSION)"
            echo "- Image: \`ghcr.io/nightbaker/fleans-rest-caller:$VERSION\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --generate-notes --notes-file notes.md $prerelease
