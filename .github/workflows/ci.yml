name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      # Restores Fleans.ExternalTasks.Sdk $(FleansVersion) from nuget.org — red until that Fleans release is published.
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # A worker takes no dependency on Orleans, directly or transitively (nightBaker/fleans#1013).
      - name: Host has no Orleans dependency
        run: |
          if dotnet list src/Fleans.Plugins.Host package --include-transitive | grep -i 'orleans'; then
            echo "::error::Fleans.Plugins.Host must not depend on Orleans"
            exit 1
          fi
      - name: Test (SQLite + PostgreSQL via Testcontainers)
        env:
          FLEANS_PG_TESTS: "1"
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"
      - name: Fail if the PostgreSQL tests were skipped
        run: |
          # Every test project writes its own file; the PostgreSQL tests are in only one of them.
          skipped=$(find tests -name tests.trx -print0 | xargs -0 python3 -c "import sys,xml.etree.ElementTree as ET; ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}; files=sys.argv[1:]; assert files, 'no tests.trx found'; counters=[ET.parse(f).getroot().find('.//t:Counters',ns) for f in files]; print(sum(int(c.get('notExecuted','0'))+int(c.get('inconclusive','0')) for c in counters))")
          echo "skipped/inconclusive: $skipped"
          [ "$skipped" -eq 0 ]

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fleans-plugins:ci .
